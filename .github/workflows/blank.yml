name: CI

on:
  schedule:
      - cron: '0 20 */3 * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: refresh
        run: |
          bash refresh.sh
      - uses: stefanzweifel/git-auto-commit-action@v7
